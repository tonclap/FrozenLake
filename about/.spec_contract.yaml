  - id: C1
    text: >-
      Среда — Gym FrozenLake-v1, 4×4, is_slippery=False; карты генерируются
      со случайной/варьируемой долей льда (p).
    check: content_match
    target:
      - trainer.py
      - finetune.py
      - utils.py
    patterns: ["FrozenLake-v1", "is_slippery=False", "generate_random_map"]
    mode: union

  - id: C2
    text: >-
      Представление состояния — тензор 3×H×W: канал 0 — one-hot позиции
      агента, канал 1 — кодировка тайлов карты, канал 2 — нормированное
      манхэттенское расстояние до цели.
    check: content_match
    target: dqn_model.py
    patterns: ["shape=\\(3, self\\.nrow, self\\.ncol\\)", "one_hot", "манхэттен"]
    note: >-
      Подозрение на дрейф: dqn_model.py (обёртка, которую использует
      основной trainer.py) сам описывает канал 2 как «Нормированная
      BFS-дистанция до цели», не манхэттенское расстояние — слова
      «манхэттен» в файле нет вовсе. Настоящее манхэттенское расстояние
      (manhattan_distance) реализовано только в curriculum_trainer.py как
      альтернативный режим shaping (--shaping manhattan), а не как канал
      наблюдения. SPECS, вероятно, описывает более раннюю/иную версию
      представления состояния, чем действующая в dqn_model.py/trainer.py.

  - id: C3
    text: >-
      Алгоритм — Double-DQN с replay-буфером, n-step возвратами и
      «воображаемыми» переходами из детерминированного симулятора.
    check: content_match
    target: trainer.py
    patterns:
      - "class ReplayMemory"
      - "def get_n_step_info"
      - "def simulate_transition"
      - "next_actions = policy_net\\(next_state_batch\\)"
    mode: union
    note: >-
      Double-DQN подтверждён по факту: action выбирается policy_net,
      оценка — target_net (классическая double-Q схема), явного слова
      "double" в коде нет.

  - id: C4
    text: >-
